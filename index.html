<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRコードリーダー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1D9E75">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f2f2f0;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 16px;
    text-align: center;
    color: #222;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e2e2df;
    padding: 16px;
    margin-bottom: 16px;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
  }
  video, canvas.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas.overlay { pointer-events: none; }
  .status {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 10px;
    min-height: 18px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  button, .file-btn {
    flex: 1;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 10px;
    border: 1px solid #d8d8d5;
    background: #fafaf8;
    color: #222;
    cursor: pointer;
    text-align: center;
  }
  button:active, .file-btn:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type="file"] { display: none; }
  .result-card {
    display: none;
  }
  .result-card.show { display: block; }
  .result-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  .result-text {
    font-size: 15px;
    word-break: break-all;
    color: #222;
    background: #f6f6f3;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .result-actions {
    display: flex;
    gap: 8px;
  }
  .history {
    margin-top: 4px;
  }
  .history-item {
    font-size: 13px;
    color: #444;
    padding: 8px 0;
    border-bottom: 1px solid #efefec;
    word-break: break-all;
  }
  .history-item:last-child { border-bottom: none; }
  .empty {
    font-size: 13px;
    color: #999;
    text-align: center;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>QRコードリーダー</h1>

  <div class="card">
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <canvas id="overlay" class="overlay"></canvas>
    </div>
    <div class="status" id="status">カメラを開始してください</div>
    <div class="btn-row">
      <button id="startBtn">カメラ開始</button>
      <button id="stopBtn" disabled>停止</button>
    </div>
    <div class="btn-row">
      <label class="file-btn" for="fileInput">画像から読み取る</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-label">読み取り結果</div>
    <div class="result-text" id="resultText"></div>
    <div class="result-actions">
      <button id="copyBtn">コピー</button>
      <button id="openBtn">開く</button>
    </div>
  </div>

  <div class="card">
    <div class="result-label">履歴</div>
    <div class="history" id="history">
      <div class="empty">まだ読み取り履歴はありません</div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const status = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const fileInput = document.getElementById('fileInput');
const resultCard = document.getElementById('resultCard');
const resultText = document.getElementById('resultText');
const copyBtn = document.getElementById('copyBtn');
const openBtn = document.getElementById('openBtn');
const historyEl = document.getElementById('history');

let stream = null;
let scanning = false;
let rafId = null;
let history = [];
let lastCode = null;
let lastCodeTime = 0;
let dbReady = false;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('qr-reader-db', 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore('history');
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function loadHistory() {
  return new Promise((resolve) => {
    if (!db) { resolve([]); return; }
    const tx = db.transaction('history', 'readonly');
    const store = tx.objectStore('history');
    const req = store.get('list');
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

function saveHistory() {
  if (!db) return;
  const tx = db.transaction('history', 'readwrite');
  tx.objectStore('history').put(history, 'list');
}

const scanCanvas = document.createElement('canvas');
const sctx = scanCanvas.getContext('2d', { willReadFrequently: true });

function setStatus(text) {
  status.textContent = text;
}

function drawBox(loc) {
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (!loc) return;
  octx.strokeStyle = '#1D9E75';
  octx.lineWidth = 4;
  octx.beginPath();
  octx.moveTo(loc.topLeftCorner.x, loc.topLeftCorner.y);
  octx.lineTo(loc.topRightCorner.x, loc.topRightCorner.y);
  octx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
  octx.lineTo(loc.bottomLeftCorner.x, loc.bottomLeftCorner.y);
  octx.closePath();
  octx.stroke();
}

function showResult(text) {
  resultText.textContent = text;
  resultCard.classList.add('show');
  const isUrl = /^https?:\/\//i.test(text);
  openBtn.style.display = isUrl ? '' : 'none';

  const now = Date.now();
  if (text === lastCode && now - lastCodeTime < 4000) return;
  lastCode = text;
  lastCodeTime = now;
  history.unshift({ text, time: new Date().toLocaleTimeString('ja-JP') });
  history = history.slice(0, 10);
  saveHistory();
  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyEl.innerHTML = '<div class="empty">まだ読み取り履歴はありません</div>';
    return;
  }
  historyEl.innerHTML = history.map(h =>
    `<div class="history-item">${h.time} — ${escapeHtml(h.text)}</div>`
  ).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function startCamera() {
  try {
    setStatus('カメラを起動しています…');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    await video.play();
    scanning = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus('QRコードをカメラに映してください');
    tick();
  } catch (err) {
    setStatus('カメラを起動できませんでした。権限を確認してください。');
  }
}

function stopCamera() {
  scanning = false;
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  octx.clearRect(0, 0, overlay.width, overlay.height);
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setStatus('カメラを開始してください');
}

function tick() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    scanCanvas.width = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    sctx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
    const imageData = sctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code) {
      drawBox(code.location);
      showResult(code.data);
      setStatus('読み取りました');
    } else {
      drawBox(null);
      setStatus('QRコードをカメラに映してください');
    }
  }
  rafId = requestAnimationFrame(tick);
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    const imageData = cx.getImageData(0, 0, c.width, c.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      showResult(code.data);
      setStatus('画像からQRコードを読み取りました');
    } else {
      setStatus('画像からQRコードが見つかりませんでした');
    }
  };
  img.src = URL.createObjectURL(file);
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(resultText.textContent).then(() => {
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'コピーしました';
    setTimeout(() => { copyBtn.textContent = orig; }, 1500);
  });
});

openBtn.addEventListener('click', () => {
  window.open(resultText.textContent, '_blank');
});

startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

(async () => {
  try {
    await openDB();
    history = await loadHistory();
    renderHistory();
  } catch (e) {
    console.warn('IndexedDB failed, falling back to memory only');
  }
})();
</script>
</body>
</html>
